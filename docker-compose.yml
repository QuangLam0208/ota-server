services:
  ota-server:
    build: .
    ports:
      - "3001:3001"
    env_file:
      - .env
    volumes:
      - ./updates:/app/updates
      - ./keys:/app/keys:ro
    restart: unless-stopped

  # Optional: Dùng khi muốn public qua ngrok ra ngoài Internet
  # Để chạy kèm ngrok: docker compose --profile ngrok up -d
  ngrok:
    profiles: ["ngrok"]
    image: ngrok/ngrok:latest
    restart: unless-stopped
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN:-}
    command: http ota-server:3001 --url=${NGROK_DOMAIN:-}
    ports:
      - "4040:4040"
    depends_on:
      - ota-server

